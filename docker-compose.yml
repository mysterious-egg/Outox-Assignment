services:
  postgres:
    image: postgres:16
    container_name: outbox
    restart: unless-stopped
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox_password
      POSTGRES_DB: reachinbox
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: outbox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: